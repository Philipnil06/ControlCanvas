<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ed"/>
      <stop offset="100%" stop-color="#ece9df"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f7f0"/>
      <stop offset="100%" stop-color="#f2efe6"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <rect x="35" y="35" width="1330" height="690" rx="18" fill="#f7f5ee" stroke="#d8d4c8"/>

  <text x="65" y="90" fill="#1f1f1b" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">PAPER FINDINGS</text>
  <rect x="1130" y="55" width="210" height="42" rx="21" fill="#e7ebff" stroke="#b8c2ff"/>
  <text x="1155" y="82" fill="#2e43b4" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700">VALID RUNS FOR METRICS</text>

  <rect x="65" y="120" width="1270" height="1" fill="#d8d4c8"/>

  <text x="65" y="180" fill="#121212" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">VALID vs EXCLUDED</text>

  <text x="65" y="250" fill="#1f1f1b" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">50</text>
  <text x="135" y="250" fill="#4b4a44" font-size="26" font-family="Segoe UI, Arial, sans-serif">Total runs</text>

  <text x="65" y="302" fill="#1f1f1b" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">47</text>
  <text x="135" y="302" fill="#4b4a44" font-size="26" font-family="Segoe UI, Arial, sans-serif">Valid</text>

  <text x="65" y="354" fill="#1f1f1b" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">3</text>
  <text x="135" y="354" fill="#4b4a44" font-size="26" font-family="Segoe UI, Arial, sans-serif">Excluded</text>

  <text x="65" y="406" fill="#1f1f1b" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">94%</text>
  <text x="165" y="406" fill="#4b4a44" font-size="26" font-family="Segoe UI, Arial, sans-serif">Valid rate</text>

  <text x="65" y="480" fill="#121212" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Baseline Comparison</text>
  <rect x="65" y="500" width="1270" height="56" rx="14" fill="url(#card)" stroke="#d8d4c8"/>
  <text x="85" y="537" fill="#121212" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Baseline</text>
  <text x="430" y="537" fill="#121212" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Runs</text>
  <text x="650" y="537" fill="#121212" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Detect%</text>
  <text x="880" y="537" fill="#121212" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">FP%</text>
  <text x="1080" y="537" fill="#121212" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700">F1%</text>

  <text x="65" y="610" fill="#121212" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Inspector Ablation</text>
  <rect x="65" y="630" width="1270" height="56" rx="14" fill="url(#card)" stroke="#d8d4c8"/>

  <text x="65" y="720" fill="#6b675d" font-size="18" font-family="Segoe UI, Arial, sans-serif">
    Demo preview of the ControlCanvas paper findings panel
